<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="bg-watermark">A ا B ب C ج D د</div>

    <div class="app-wrapper">
        <nav class="top-nav">
            <button id="nav-translator" class="nav-btn active">🌐 Translator</button>
            <button id="nav-calculator" class="nav-btn">🧮 Calculator</button>
            <button id="nav-programmer" class="nav-btn">🤖 Base Converter</button>
        </nav>

        <div id="screen-translator" class="container">
            <h2>✨ Pro Translator</h2>
            <div class="controls">
                <div class="select-wrapper">
                    <select id="lang-from">
                        <option value="en">🇬🇧 English</option>
                        <option value="ar">🇸🇦 Arabic</option>
                    </select>
                </div>
                <button id="swap-btn">⇄</button>
                <div class="select-wrapper">
                    <select id="lang-to">
                        <option value="ar">🇸🇦 Arabic</option>
                        <option value="en">🇬🇧 English</option>
                    </select>
                </div>
            </div>
            <div class="text-areas">
                <textarea id="input-text" placeholder="Type here..."></textarea>
                <textarea id="output-text" placeholder="Translation..." readonly></textarea>
            </div>
            <button id="translate-btn">Translate</button>
        </div>

        <div id="screen-calculator" class="container hidden">
            <h2>🧮 Math</h2>
            <div class="math-controls">
                <input type="number" id="num1" placeholder="0">
                <select id="operator"><option>+</option><option>-</option><option>*</option><option>/</option></select>
                <input type="number" id="num2" placeholder="0">
                <button id="calc-btn">=</button>
                <input type="text" id="calc-result" readonly>
            </div>
        </div>

        <div id="screen-programmer" class="container hidden">
            <h2>🤖 Base Converter</h2>
            <div class="base-inputs">
                <div class="input-group"><label>Decimal</label><input type="text" id="base-dec"></div>
                <div class="input-group"><label>Binary</label><input type="text" id="base-bin"></div>
                <div class="input-group"><label>Octal</label><input type="text" id="base-oct"></div>
                <div class="input-group"><label>Hex</label><input type="text" id="base-hex"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
